name: OPNMF Apple Silicon fine GUI shards

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  test:
    name: Apple Silicon fine - ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: gui_main_001
            expected: 17
          - shard: gui_main_002
            expected: 17
          - shard: gui_main_003
            expected: 17
          - shard: gui_main_004
            expected: 17
          - shard: gui_main_005
            expected: 16
          - shard: gui_main_006
            expected: 17
          - shard: gui_support_001
            expected: 18
          - shard: gui_support_002
            expected: 16
          - shard: gui_support_003
            expected: 12
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out acceptance package
        uses: actions/checkout@v6

      - name: Decrypt and verify exact release archive
        shell: bash
        env:
          ARCHIVE_KEY_HEX: ${{ secrets.ARCHIVE_KEY_HEX }}
        run: |
          set -euo pipefail
          node decrypt_release.mjs GUI-260902.zip.enc GUI-260902.zip
          echo "24BC909FA1D7946B21E2FE644C674B1B072CD22DAAAF16A9A3600B96B9CA1CE0  GUI-260902.zip" | shasum -a 256 -c -
          ditto -x -k GUI-260902.zip .
          mkdir -p "artifacts/fine/${{ matrix.shard }}"
          sw_vers | tee "artifacts/fine/${{ matrix.shard }}/macos.txt"
          uname -a | tee -a "artifacts/fine/${{ matrix.shard }}/macos.txt"
          sysctl -n hw.memsize | awk '{printf "MemoryBytes: %s\n", $1}' | tee -a "artifacts/fine/${{ matrix.shard }}/macos.txt"

      - name: Ensure Java 11
        shell: bash
        run: |
          set -euo pipefail
          if ! /usr/libexec/java_home -v 11 >/dev/null 2>&1; then
            brew install --cask corretto@11
          fi
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 11)" >> "$GITHUB_ENV"

      - name: Set up MATLAB and required toolbox
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Run fine shard
        uses: matlab-actions/run-command@v3
        with:
          command: mac_fine_probe("${{ matrix.shard }}", ${{ matrix.expected }})
          generate-summary: true

      - name: Upload fine shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opnmf-macos-arm64-fine-${{ matrix.shard }}
          path: artifacts/fine/${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14
