name: OPNMF Apple Silicon diagnostic shards

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  test:
    name: Apple Silicon - ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: base
            label: base 44 tests
            expected: 44
          - shard: numeric
            label: numeric 66 tests
            expected: 66
          - shard: gui_support
            label: GUI support 46 tests
            expected: 46
          - shard: gui_main
            label: OPNMFApp 101 tests
            expected: 101
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out acceptance package
        uses: actions/checkout@v6

      - name: Decrypt and verify exact release archive
        shell: bash
        env:
          ARCHIVE_KEY_HEX: ${{ secrets.ARCHIVE_KEY_HEX }}
        run: |
          set -euo pipefail
          node decrypt_release.mjs GUI-260902.zip.enc GUI-260902.zip
          echo "24BC909FA1D7946B21E2FE644C674B1B072CD22DAAAF16A9A3600B96B9CA1CE0  GUI-260902.zip" | shasum -a 256 -c -
          ditto -x -k GUI-260902.zip .
          mkdir -p "artifacts/shards/${{ matrix.shard }}"
          sw_vers | tee "artifacts/shards/${{ matrix.shard }}/macos.txt"
          uname -a | tee -a "artifacts/shards/${{ matrix.shard }}/macos.txt"
          sysctl -n hw.memsize | awk '{printf "MemoryBytes: %s\n", $1}' | tee -a "artifacts/shards/${{ matrix.shard }}/macos.txt"

      - name: Ensure Java 11
        shell: bash
        run: |
          set -euo pipefail
          if ! /usr/libexec/java_home -v 11 >/dev/null 2>&1; then
            brew install --cask corretto@11
          fi
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 11)" >> "$GITHUB_ENV"

      - name: Set up MATLAB and required toolbox
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Run shard
        uses: matlab-actions/run-command@v3
        with:
          command: mac_shard_probe("${{ matrix.shard }}", ${{ matrix.expected }})
          generate-summary: true

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opnmf-macos-arm64-${{ matrix.shard }}
          path: artifacts/shards/${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

